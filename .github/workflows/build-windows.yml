name: build-windows

# Manual Windows-only build: produces NSIS + MSI installers as workflow
# artifacts — no release is created and no other platform is built.
#
# Why this exists: release.yml only attaches installers on a version-tag push
# (tauri-action's tagName is empty on workflow_dispatch, so it validates the
# build but uploads nothing), and check.yml compiles + tests but never bundles.
# Dispatch this on any branch to get a whatRust_-setup.exe / .msi from the
# Actions run page a few minutes later.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The npm CLI ships prebuilt binaries and installs in seconds; compiling
      # tauri-cli from source with cargo install would add ~5-10 min per run.
      # frontendDist is a plain static folder (../settings-ui) and there is no
      # beforeBuildCommand, so `tauri build` needs nothing else.
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Build installers (NSIS + MSI)
        working-directory: src-tauri
        run: tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: whatRust-windows-installer-${{ github.run_number }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
